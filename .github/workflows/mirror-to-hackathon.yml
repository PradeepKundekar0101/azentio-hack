# Mirrors this repo into the hackathon org repo, so pushes, merges and branch
# deletions made on GitHub reach it too (local `git push` already updates both).
# Needs the HACKATHON_MIRROR_TOKEN secret: a fine-grained token limited to the
# hackathon repo with Contents read/write (the org does not allow deploy keys).
name: Mirror to hackathon repo

on:
  push:
  delete:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hackathon-mirror-${{ github.event.ref || github.ref }}
  cancel-in-progress: false

env:
  MIRROR_REPO: AzentioHackathon-2026/CLAIM_LEAKAGE_DETECTION_SUPERPOWER

jobs:
  mirror:
    # The workflow travels with the code, so skip it inside the mirror itself.
    if: github.repository == 'PradeepKundekar0101/azentio-hack'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Keep this repo's GITHUB_TOKEN out of the git config, so it is never sent to the hackathon repo.
          persist-credentials: false

      - name: Set up access to the hackathon repo
        env:
          MIRROR_TOKEN: ${{ secrets.HACKATHON_MIRROR_TOKEN }}
        run: |
          if [ -z "$MIRROR_TOKEN" ]; then
            echo "::error::The HACKATHON_MIRROR_TOKEN secret is not set."
            exit 1
          fi
          git remote add hackathon "https://x-access-token:${MIRROR_TOKEN}@github.com/${MIRROR_REPO}.git"
          git ls-remote --heads hackathon > /dev/null

      - name: Mirror the pushed branch or tag
        if: github.event_name == 'push'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          ref="$GITHUB_REF"
          # Branches push the exact pushed commit; tags push the tag itself so annotations survive.
          if [[ "$ref" == refs/tags/* ]]; then src="$ref"; else src="$GITHUB_SHA"; fi
          new=$(git rev-parse "$src")
          old=$(git ls-remote hackathon "$ref" | awk 'NR == 1 { print $1 }')
          if [ "$old" = "$new" ]; then
            echo "$ref is already at $new in the hackathon repo."
          elif [ -n "$old" ] && [ "$old" = "$BEFORE" ]; then
            # The mirror matched this repo before the push, so it is safe to follow a rewrite.
            git push --force-with-lease="$ref:$old" hackathon "$src:$ref"
          else
            # New ref, or the mirror is behind: fast-forward only, so commits pushed
            # straight to the hackathon repo are never overwritten.
            git push hackathon "$src:$ref"
          fi

      - name: Mirror the deleted branch or tag
        if: github.event_name == 'delete'
        env:
          REF_TYPE: ${{ github.event.ref_type }}
          REF_NAME: ${{ github.event.ref }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ "$REF_TYPE" = tag ]; then ref="refs/tags/$REF_NAME"; else ref="refs/heads/$REF_NAME"; fi
          old=$(git ls-remote hackathon "$ref" | awk 'NR == 1 { print $1 }')
          if [ -z "$old" ]; then
            echo "$ref is already gone from the hackathon repo."
            exit 0
          fi
          # Delete only when the mirrored tip is still kept here (in a branch, tag or
          # pull request), so work pushed straight to the hackathon repo is never lost.
          git fetch --quiet "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            '+refs/pull/*/head:refs/pull/*/head'
          if git cat-file -e "$old^{commit}" 2>/dev/null; then
            git push --force-with-lease="$ref:$old" hackathon ":$ref"
          else
            echo "::warning::Kept $ref in the hackathon repo: its tip $old is not in this repo, so it may hold work made there."
          fi

      - name: Catch up every branch and tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          git symbolic-ref --delete --quiet refs/remotes/origin/HEAD || true
          # Fast-forward only: anything that diverged in the hackathon repo fails loudly instead of being overwritten.
          git push hackathon 'refs/remotes/origin/*:refs/heads/*' 'refs/tags/*:refs/tags/*'
