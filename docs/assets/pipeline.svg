<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Processing pipeline: ingest, validate, policy rules, duplicates, alerts">
  <title>Processing pipeline</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#07090b"/>
      <stop offset="1" stop-color="#0f2a2d"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <radialGradient id="pulse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.4" stop-color="#5fb4b5"/>
      <stop offset="1" stop-color="#5fb4b5" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }
      .flow { stroke-dasharray: 6 8; animation: flow 1.2s linear infinite; }
      @keyframes flow { to { stroke-dashoffset: -28; } }
      .stage rect.box { fill: #1d1a17; stroke: #24504f; stroke-width: 1.5; }
      .stage { animation: lit 7.5s ease-in-out infinite; }
      .s1 { animation-delay: 0s; } .s2 { animation-delay: 1.5s; } .s3 { animation-delay: 3s; }
      .s4 { animation-delay: 4.5s; } .s5 { animation-delay: 6s; }
      @keyframes lit {
        0%, 22%, 100% { opacity: 0.62; }
        6%, 14% { opacity: 1; }
      }
      .stage .ring { opacity: 0; animation: ring 7.5s ease-in-out infinite; animation-delay: inherit; }
      @keyframes ring {
        0%, 22%, 100% { opacity: 0; }
        6%, 14% { opacity: 1; }
      }
    </style>
  </defs>

  <rect width="1200" height="300" rx="20" fill="url(#bg)"/>
  <rect width="1200" height="300" rx="20" fill="url(#grid)"/>

  <text x="40" y="44" class="sans" font-size="13" font-weight="700" fill="#5fb4b5" letter-spacing="2">PROCESSING PIPELINE</text>
  <text x="1160" y="44" class="sans" font-size="13" fill="#948a80" text-anchor="end">Deterministic Python · every number traces to a stored rule and record</text>

  <!-- Connectors -->
  <g stroke="#5fb4b5" stroke-width="2" fill="none" stroke-opacity="0.75">
    <path class="flow" d="M228 160H252"/>
    <path class="flow" d="M452 160H476"/>
    <path class="flow" d="M676 160H700"/>
    <path class="flow" d="M900 160H924"/>
  </g>
  <path id="track" d="M128 252H1024" fill="none" stroke="#5fb4b5" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round"/>

  <!-- Stages: 200 wide, 24 gap, starting at x=28 -->
  <g class="stage s1">
    <rect class="ring" x="24" y="88" width="208" height="152" rx="18" fill="none" stroke="#5fb4b5" stroke-width="2"/>
    <rect class="box" x="28" y="92" width="200" height="144" rx="14"/>
    <text x="48" y="124" class="mono" font-size="12" fill="#5fb4b5">01</text>
    <text x="48" y="152" class="sans" font-size="20" font-weight="700" fill="#ffffff">Ingest</text>
    <text x="48" y="178" class="sans" font-size="13" fill="#a9cfcd">CSV · Excel · JSON</text>
    <text x="48" y="198" class="sans" font-size="13" fill="#a9cfcd">Invoice PDFs and scans</text>
    <text x="48" y="218" class="sans" font-size="13" fill="#a9cfcd">Header synonym map</text>
  </g>

  <g class="stage s2">
    <rect class="ring" x="248" y="88" width="208" height="152" rx="18" fill="none" stroke="#5fb4b5" stroke-width="2"/>
    <rect class="box" x="252" y="92" width="200" height="144" rx="14"/>
    <text x="272" y="124" class="mono" font-size="12" fill="#5fb4b5">02</text>
    <text x="272" y="152" class="sans" font-size="20" font-weight="700" fill="#ffffff">Validate</text>
    <text x="272" y="178" class="sans" font-size="13" fill="#a9cfcd">IDs, dates, amounts</text>
    <text x="272" y="198" class="sans" font-size="13" fill="#a9cfcd">Cross-record checks</text>
    <text x="272" y="218" class="sans" font-size="13" fill="#a9cfcd">No silent drops</text>
  </g>

  <g class="stage s3">
    <rect class="ring" x="472" y="88" width="208" height="152" rx="18" fill="none" stroke="#5fb4b5" stroke-width="2"/>
    <rect class="box" x="476" y="92" width="200" height="144" rx="14"/>
    <text x="496" y="124" class="mono" font-size="12" fill="#5fb4b5">03</text>
    <text x="496" y="152" class="sans" font-size="20" font-weight="700" fill="#ffffff">Policy rules</text>
    <text x="496" y="178" class="sans" font-size="13" fill="#a9cfcd">Checks C01 to C12</text>
    <text x="496" y="198" class="sans" font-size="13" fill="#a9cfcd">Sub-limits, co-pay</text>
    <text x="496" y="218" class="sans" font-size="13" fill="#a9cfcd">Step-by-step payable</text>
  </g>

  <g class="stage s4">
    <rect class="ring" x="696" y="88" width="208" height="152" rx="18" fill="none" stroke="#5fb4b5" stroke-width="2"/>
    <rect class="box" x="700" y="92" width="200" height="144" rx="14"/>
    <text x="720" y="124" class="mono" font-size="12" fill="#5fb4b5">04</text>
    <text x="720" y="152" class="sans" font-size="20" font-weight="700" fill="#ffffff">Duplicates</text>
    <text x="720" y="178" class="sans" font-size="13" fill="#a9cfcd">Exact claim, line item</text>
    <text x="720" y="198" class="sans" font-size="13" fill="#a9cfcd">Near-duplicate score</text>
    <text x="720" y="218" class="sans" font-size="13" fill="#a9cfcd">Clears real repeats</text>
  </g>

  <g class="stage s5">
    <rect class="ring" x="920" y="88" width="208" height="152" rx="18" fill="none" stroke="#5fb4b5" stroke-width="2"/>
    <rect class="box" x="924" y="92" width="200" height="144" rx="14"/>
    <text x="944" y="124" class="mono" font-size="12" fill="#5fb4b5">05</text>
    <text x="944" y="152" class="sans" font-size="20" font-weight="700" fill="#ffffff">Alerts</text>
    <text x="944" y="178" class="sans" font-size="13" fill="#a9cfcd">Category, severity</text>
    <text x="944" y="198" class="sans" font-size="13" fill="#a9cfcd">Formula with values</text>
    <text x="944" y="218" class="sans" font-size="13" fill="#a9cfcd">Linked source rows</text>
  </g>

  <!-- Travelling pulse -->
  <circle r="9" fill="url(#pulse)">
    <animateMotion dur="7.5s" repeatCount="indefinite" keyPoints="0;0;0.25;0.25;0.5;0.5;0.75;0.75;1;1" keyTimes="0;0.12;0.2;0.32;0.4;0.52;0.6;0.72;0.8;1" calcMode="linear">
      <mpath href="#track"/>
    </animateMotion>
  </circle>

  <text x="600" y="284" class="sans" font-size="13" fill="#948a80" text-anchor="middle">AI only reads uploaded documents, and its output goes through the same validation as file imports.</text>
</svg>
