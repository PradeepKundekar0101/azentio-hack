# DigitalOcean App Platform spec. ${...} values are filled from the gitignored backend/.env and .env.do by
# infra/render_spec.py at deploy time; App Platform stores the SECRET ones encrypted.
#   python3 infra/render_spec.py > "$TMPDIR/spec.yaml" && doctl apps create --spec "$TMPDIR/spec.yaml"          (first deploy)
#   python3 infra/render_spec.py > "$TMPDIR/spec.yaml" && doctl apps update <app-id> --spec "$TMPDIR/spec.yaml"
#   doctl apps create-deployment <app-id>                                                                     (code changes)
#
# Source: the public GitHub repository over HTTPS, so no GitHub app integration is needed.
# One domain for both components: /api and /health go to the backend, everything else to the frontend, so the
# session cookie is first-party.
name: azentio-hack
region: blr
ingress:
  rules:
    - match: { path: { prefix: /api } }
      component: { name: api, preserve_path_prefix: true }
    - match: { path: { prefix: /health } }
      component: { name: api, preserve_path_prefix: true }
    - match: { path: { prefix: / } }
      component: { name: web }
services:
  - name: api
    git: { repo_clone_url: https://github.com/PradeepKundekar0101/azentio-hack.git, branch: main }
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    http_port: 8000
    # Docling's layout and table models need about 2-3 GB of memory while reading an invoice.
    instance_size_slug: apps-s-2vcpu-4gb
    instance_count: 1
    health_check:
      http_path: /health
      initial_delay_seconds: 20
      period_seconds: 15
      timeout_seconds: 10
      failure_threshold: 6
    envs: &backend_envs
      - { key: APP_ENV, value: demo }
      - { key: DATABASE_URL, type: SECRET, value: "${DATABASE_URL}" }
      - { key: SPACES_REGION, value: "${SPACES_REGION}" }
      - { key: SPACES_ENDPOINT_URL, value: "${SPACES_ENDPOINT_URL}" }
      - { key: SPACES_BUCKET, value: "${SPACES_BUCKET}" }
      - { key: SPACES_PREFIX, value: "${SPACES_PREFIX}" }
      - { key: SPACES_ACCESS_KEY_ID, type: SECRET, value: "${SPACES_ACCESS_KEY_ID}" }
      - { key: SPACES_SECRET_ACCESS_KEY, type: SECRET, value: "${SPACES_SECRET_ACCESS_KEY}" }
      - { key: SESSION_SECRET, type: SECRET, value: "${DEPLOY_SESSION_SECRET}" }
      - { key: DEMO_USERNAME, value: "${DEMO_USERNAME}" }
      - { key: DEMO_PASSWORD, type: SECRET, value: "${DEPLOY_DEMO_PASSWORD}" }
      # The judging demo shows the three demo accounts on the sign-in page for one-click sign-in.
      - { key: DEMO_QUICK_LOGIN, value: "true" }
      - { key: COOKIE_SECURE, value: "true" }
      - { key: CORS_ORIGINS, value: "${APP_URL}" }
      - { key: ANTHROPIC_API_KEY, type: SECRET, value: "${ANTHROPIC_API_KEY}" }
  - name: web
    git: { repo_clone_url: https://github.com/PradeepKundekar0101/azentio-hack.git, branch: main }
    source_dir: frontend
    environment_slug: node-js
    build_command: pnpm install --frozen-lockfile && pnpm build
    run_command: pnpm start --port 8080
    http_port: 8080
    instance_size_slug: apps-s-1vcpu-1gb
    instance_count: 1
jobs:
  - name: migrate
    kind: PRE_DEPLOY
    git: { repo_clone_url: https://github.com/PradeepKundekar0101/azentio-hack.git, branch: main }
    source_dir: backend
    dockerfile_path: backend/Dockerfile
    instance_size_slug: apps-s-1vcpu-1gb
    run_command: uv run --no-sync alembic upgrade head && uv run --no-sync python -m scripts.seed_reference
    envs: *backend_envs
